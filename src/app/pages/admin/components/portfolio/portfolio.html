<div class="space-y-6">
    <!-- Cabeçalho -->
    <div class="flex justify-between items-center">
        <div>
            <h2 class="font-serif text-2xl">Gerenciar Portfólio</h2>
            <p class="text-sm text-muted-foreground">Adicione, edite ou remova fotos do seu portfólio</p>
        </div>
        <button (click)="openAddModal()"
            class="px-4 py-2 bg-accent hover:bg-accent/90 text-accent-foreground rounded-none transition">
            + Adicionar foto
        </button>
    </div>

    <!-- Lista de itens -->
    <div *ngIf="isLoading" class="text-center py-12">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-accent"></div>
    </div>

    <div *ngIf="!isLoading && portfolioItems.length === 0" class="text-center py-12 text-muted-foreground bg-muted/20">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" class="mx-auto mb-4 opacity-50">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
            <circle cx="8.5" cy="8.5" r="2.5"></circle>
            <polyline points="22 15 16 9 6 19 2 15"></polyline>
        </svg>
        <p>Nenhuma foto no portfólio</p>
        <p class="text-sm mt-2">Clique em "Adicionar foto" para começar</p>
    </div>

    <!-- Grid de itens -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div *ngFor="let item of portfolioItems; let i = index"
            class="border border-border rounded-lg overflow-hidden bg-white hover:shadow-elevated transition">
            <img [src]="item.image_data" [alt]="item.title" class="w-full h-48 object-cover">
            <div class="p-4">
                <h3 class="font-serif text-lg">{{ item.title }}</h3>
                <p class="text-xs text-accent uppercase tracking-wider">{{ item.category }}</p>
                <div class="flex justify-between items-center mt-3 pt-3 border-t border-border">
                    <div class="flex gap-2">
                        <button (click)="moveUp(i)" *ngIf="i > 0" class="text-muted-foreground hover:text-foreground"
                            title="Mover para cima">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="18 15 12 9 6 15"></polyline>
                            </svg>
                        </button>
                        <button (click)="moveDown(i)" *ngIf="i < portfolioItems.length - 1"
                            class="text-muted-foreground hover:text-foreground" title="Mover para baixo">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                    </div>
                    <div class="flex gap-2">
                        <button (click)="openEditModal(item)"
                            class="text-blue-600 hover:text-blue-800 text-sm">Editar</button>
                        <button (click)="deleteItem(item.id)"
                            class="text-red-600 hover:text-red-800 text-sm">Excluir</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de adicionar/editar -->
    <div *ngIf="showModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
        (click)="closeModal()">
        <div class="bg-background max-w-2xl w-full mx-4 rounded-lg shadow-elevated max-h-[90vh] overflow-y-auto"
            (click)="$event.stopPropagation()">
            <div class="p-6 border-b border-border">
                <h3 class="font-serif text-xl">{{ editingItem ? 'Editar' : 'Adicionar' }} foto ao portfólio</h3>
            </div>

            <div class="p-6 space-y-4">
                <!-- Preview da imagem -->
                <div *ngIf="selectedImage" class="mb-4">
                    <p class="text-sm font-medium mb-2">Preview:</p>
                    <img [src]="selectedImage" alt="Preview"
                        class="w-full h-48 object-cover rounded-lg border border-border">
                </div>

                <!-- Upload de imagem -->
                <div>
                    <label class="block text-sm font-medium mb-2">Imagem *</label>
                    <input type="file" (change)="onFileSelected($event)" accept="image/jpeg,image/png,image/jpg" class="block w-full text-sm text-muted-foreground
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-none file:border-0
                        file:text-sm file:font-medium
                        file:bg-accent/10 file:text-accent
                        hover:file:bg-accent/20
                        cursor-pointer">
                    <p class="text-xs text-muted-foreground mt-1">JPG, PNG. Máx 5MB</p>
                </div>

                <!-- Título -->
                <div>
                    <label class="block text-sm font-medium mb-2">Título *</label>
                    <input type="text" [(ngModel)]="title"
                        class="w-full px-3 py-2 border border-border rounded-none focus:outline-none focus:ring-1 focus:ring-ring bg-background"
                        placeholder="Ex: Ensaio Casal">
                </div>

                <!-- Categoria -->
                <div>
                    <label class="block text-sm font-medium mb-2">Categoria *</label>
                    <select [(ngModel)]="category"
                        class="w-full px-3 py-2 border border-border rounded-none focus:outline-none focus:ring-1 focus:ring-ring bg-background">
                        <option value="">Selecione...</option>
                        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
                    </select>
                </div>

                <!-- Span (tamanho no grid) -->
                <div>
                    <label class="block text-sm font-medium mb-2">Tamanho (opcional)</label>
                    <select [(ngModel)]="span"
                        class="w-full px-3 py-2 border border-border rounded-none focus:outline-none focus:ring-1 focus:ring-ring bg-background">
                        <option value="">Normal</option>
                        <option value="md:col-span-2">Duas colunas (destaque)</option>
                    </select>
                </div>

                <!-- Erro -->
                <div *ngIf="uploadError" class="p-3 bg-red-50 border border-red-200 text-red-600 text-sm">
                    {{ uploadError }}
                </div>
            </div>

            <div class="p-6 border-t border-border flex justify-end gap-3">
                <button (click)="closeModal()"
                    class="px-4 py-2 border border-border rounded hover:bg-muted">Cancelar</button>
                <button (click)="saveItem()" [disabled]="isUploading"
                    class="px-4 py-2 bg-accent hover:bg-accent/90 text-accent-foreground rounded-none transition disabled:opacity-50">
                    {{ isUploading ? 'Salvando...' : (editingItem ? 'Atualizar' : 'Adicionar') }}
                </button>
            </div>
        </div>
    </div>
</div>
