<div class="min-h-screen bg-background flex flex-col">
    <app-navbar></app-navbar>

    <div class="flex-1 pt-16">
        <!-- Menu de abas horizontal -->
        <div class="border-b border-border bg-white/50 top-16 z-30">
            <div class="container mx-auto px-4">
                <div class="flex justify-between items-center">
                    <!-- Abas à esquerda -->
                    <div class="flex gap-1">
                        <button (click)="activeTab = 'bookings'"
                            class="px-6 py-4 text-sm font-medium transition border-b-2 -mb-px"
                            [class.border-accent]="activeTab === 'bookings'"
                            [class.text-accent]="activeTab === 'bookings'"
                            [class.border-transparent]="activeTab !== 'bookings'"
                            [class.text-muted-foreground]="activeTab !== 'bookings'">
                            <span class="flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg>
                                Agendamentos
                            </span>
                        </button>
                        <button (click)="activeTab = 'portfolio'"
                            class="px-6 py-4 text-sm font-medium transition border-b-2 -mb-px"
                            [class.border-accent]="activeTab === 'portfolio'"
                            [class.text-accent]="activeTab === 'portfolio'"
                            [class.border-transparent]="activeTab !== 'portfolio'"
                            [class.text-muted-foreground]="activeTab !== 'portfolio'">
                            <span class="flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                                    <circle cx="8.5" cy="8.5" r="2.5"></circle>
                                    <polyline points="22 15 16 9 6 19 2 15"></polyline>
                                </svg>
                                Portfólio
                            </span>
                        </button>
                        <button (click)="activeTab = 'hero'"
                            class="px-6 py-4 text-sm font-medium transition border-b-2 -mb-px"
                            [class.border-accent]="activeTab === 'hero'" [class.text-accent]="activeTab === 'hero'"
                            [class.border-transparent]="activeTab !== 'hero'"
                            [class.text-muted-foreground]="activeTab !== 'hero'">
                            <span class="flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2">
                                    <path
                                        d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
                                    <circle cx="12" cy="13" r="3" />
                                </svg>
                                Foto Apresentação
                            </span>
                        </button>
                        <button (click)="activeTab = 'session-types'"
                            class="px-6 py-4 text-sm font-medium transition border-b-2 -mb-px"
                            [class.border-accent]="activeTab === 'session-types'"
                            [class.text-accent]="activeTab === 'session-types'"
                            [class.border-transparent]="activeTab !== 'session-types'"
                            [class.text-muted-foreground]="activeTab !== 'session-types'">
                            <span class="flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2">
                                    <path
                                        d="M20 7h-4.18A3 3 0 0 0 16 5.18V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v1.18A3 3 0 0 0 8.18 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z" />
                                    <circle cx="12" cy="13" r="3" />
                                </svg>
                                Tipos de Ensaio
                            </span>
                        </button>
                    </div>

                    <!-- Usuário e logout à direita -->
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2 text-sm text-muted-foreground">
                            <span class="font-medium">{{ user?.name || user?.email }}</span>
                        </div>
                        <button (click)="logout()"
                            class="px-3 py-1.5 text-sm text-destructive hover:text-destructive/80 transition flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                <polyline points="16 17 21 12 16 7" />
                                <line x1="21" y1="12" x2="9" y2="12" />
                            </svg>
                            Sair
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <main class="p-6">
            <div class="max-w-7xl mx-auto">
                <app-bookings *ngIf="activeTab === 'bookings'"></app-bookings>
                <app-portfolio *ngIf="activeTab === 'portfolio'"></app-portfolio>
                <app-hero *ngIf="activeTab === 'hero'"></app-hero>
                <app-session-types *ngIf="activeTab === 'session-types'"></app-session-types>
            </div>
        </main>
    </div>

    <app-footer></app-footer>
</div>
