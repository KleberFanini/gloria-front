<div class="min-h-screen bg-background flex flex-col">
    <app-navbar />

    <div class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <div>
                <div class="flex justify-center">
                    <div class="w-16 h-16 bg-accent/10 rounded-full flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="text-accent">
                            <path
                                d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
                            <circle cx="12" cy="13" r="3" />
                        </svg>
                    </div>
                </div>
                <h2 class="mt-6 text-center font-serif text-3xl tracking-tight text-foreground">
                    Área Administrativa
                </h2>
                <p class="mt-2 text-center text-sm text-muted-foreground">
                    Faça login para gerenciar agendamentos
                </p>
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-8 space-y-6">
                <div class="space-y-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-foreground">E-mail</label>
                        <input id="email" type="email" formControlName="email"
                            class="mt-1 w-full px-3 py-2 border border-border rounded-none focus:outline-none focus:ring-1 focus:ring-ring bg-background"
                            placeholder="admin@lumestudio.com" />
                        <p *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
                            class="mt-1 text-sm text-destructive">
                            E-mail inválido
                        </p>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-foreground">Senha</label>
                        <input id="password" type="password" formControlName="password"
                            class="mt-1 w-full px-3 py-2 border border-border rounded-none focus:outline-none focus:ring-1 focus:ring-ring bg-background"
                            placeholder="••••••••" />
                        <p *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                            class="mt-1 text-sm text-destructive">
                            Senha obrigatória
                        </p>
                    </div>
                </div>

                <div *ngIf="errorMessage"
                    class="p-3 bg-destructive/10 border border-destructive/20 text-destructive text-sm text-center rounded">
                    {{ errorMessage }}
                </div>

                <button type="submit" [disabled]="isLoading || loginForm.invalid"
                    class="w-full h-12 px-4 bg-accent hover:bg-accent/90 text-accent-foreground rounded-none transition disabled:opacity-50 disabled:cursor-not-allowed">
                    {{ isLoading ? 'Entrando...' : 'Entrar' }}
                </button>
            </form>
        </div>
    </div>

    <app-footer />
</div>
